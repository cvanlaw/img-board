<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Image Board Admin</title>
  <link rel="stylesheet" href="/css/admin.css">
</head>
<body>
  <h1>Slideshow Admin</h1>

  <section class="card" aria-labelledby="stats-heading">
    <h2 id="stats-heading">Image Statistics</h2>
    <div id="stats-container" aria-live="polite" aria-atomic="true">
      <p>Raw images: <span class="stat" id="raw-count">-</span></p>
      <p>Processed images: <span class="stat" id="processed-count">-</span></p>
    </div>
    <p><small>Last updated: <span id="stats-timestamp">-</span></small></p>
  </section>

  <section class="card" aria-labelledby="upload-heading">
    <h2 id="upload-heading">Upload Images</h2>
    <p>Supported formats: JPG, JPEG, PNG (max 50MB each, up to 10 files)</p>

    <div id="drop-zone" class="drop-zone">
      <p>Drag and drop images here, or click to select</p>
      <input type="file" id="file-input" multiple
             accept=".jpg,.jpeg,.png,image/jpeg,image/png"
             style="display: none;" />
    </div>

    <div id="upload-preview" class="upload-preview"></div>

    <button id="upload-btn" onclick="uploadFiles()" disabled>
      Upload Selected Files
    </button>
    <button onclick="clearUploadQueue()">Clear</button>

    <div id="upload-progress" class="progress-bar" role="progressbar"
         aria-valuenow="0" aria-valuemin="0" aria-valuemax="100"
         aria-label="Upload progress" style="display: none;">
      <div class="progress-fill" id="upload-progress-fill"></div>
    </div>
    <p id="upload-message" role="status" aria-live="polite"></p>
  </section>

  <section class="card" aria-labelledby="slideshow-heading">
    <h2 id="slideshow-heading">Slideshow Settings</h2>
    <label for="interval">
      Interval (minutes):
      <input type="number" id="interval" min="0.1" step="0.1"
             aria-describedby="interval-hint" />
      <small id="interval-hint">Minimum: 0.1 minutes</small>
    </label><br>
    <button onclick="saveSlideshow()">Save Slideshow Settings</button>
    <p id="slideshow-message" role="status" aria-live="polite"></p>
  </section>

  <section class="card" aria-labelledby="preprocessing-heading">
    <h2 id="preprocessing-heading">Preprocessing Settings</h2>
    <label for="width">
      Target Width (pixels):
      <input type="number" id="width" min="1"
             aria-describedby="width-hint" />
      <small id="width-hint">Minimum: 1 pixel</small>
    </label><br>
    <label for="height">
      Target Height (pixels):
      <input type="number" id="height" min="1"
             aria-describedby="height-hint" />
      <small id="height-hint">Minimum: 1 pixel</small>
    </label><br>
    <button onclick="savePreprocessing()">Save & Reprocess All Images</button>
    <button onclick="manualReprocess()">Reprocess Now</button>
    <p id="preprocessing-message" role="status" aria-live="polite"></p>
    <div id="progress-container" style="display: none;">
      <div class="progress-bar" role="progressbar"
           aria-valuenow="0" aria-valuemin="0" aria-valuemax="100"
           aria-label="Reprocessing progress">
        <div class="progress-fill" id="progress-fill"></div>
      </div>
      <p id="progress-text">Processing: 0/0</p>
    </div>
  </section>

  <script src="/js/admin.js"></script>
</body>
</html>
