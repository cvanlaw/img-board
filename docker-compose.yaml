services:
  imgboard:
    build:
      context: ${BUILD_CONTEXT:-./source}
      dockerfile: Dockerfile
    container_name: imgboard
    restart: unless-stopped
    ports:
      - '3000:3000'
    expose:
      - '9091'
      - '9092'
    volumes:
      - ./config.json:/app/config.json
      - ${CERTS_DIR:-./certs}/cert.pem:/certs/cert.pem:ro
      - ${CERTS_DIR:-./certs}/key.pem:/certs/key.pem:ro
      - ${CERTS_DIR:-./certs}/chain.pem:/certs/chain.pem:ro
      - ${NAS_RAW:-/mnt/nas/photos/raw}:/mnt/photos/raw
      - ${NAS_PROCESSED:-/mnt/nas/photos/processed}:/mnt/photos/processed
      - ${NAS_ARCHIVE:-/mnt/nas/photos/archive}:/mnt/photos/archive
    environment:
      - NODE_ENV=production
    logging:
      driver: 'json-file'
      options:
        max-size: '10m'
        max-file: '3'
    healthcheck:
      test:
        [
          'CMD',
          'wget',
          '-q',
          '--spider',
          '--no-check-certificate',
          'https://localhost:3000/health',
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  prometheus:
    image: prom/prometheus:v2.50.1
    container_name: prometheus
    volumes:
      - ${MONITORING_DIR:-./source/monitoring}/prometheus:/etc/prometheus:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=15d'
      - '--web.enable-lifecycle'
    ports:
      - '9090:9090'
    restart: unless-stopped
    depends_on:
      - imgboard

  grafana:
    image: grafana/grafana:10.3.3
    container_name: grafana
    volumes:
      - ${MONITORING_DIR:-./source/monitoring}/grafana/provisioning:/etc/grafana/provisioning:ro
      - ${MONITORING_DIR:-./source/monitoring}/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - ${MONITORING_DIR:-./source/monitoring}/grafana/alerting:/etc/grafana/provisioning/alerting:ro
      - grafana_data:/var/lib/grafana
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
      - GF_AUTH_ANONYMOUS_ENABLED=${GRAFANA_ANONYMOUS_ENABLED:-true}
      - GF_AUTH_ANONYMOUS_ORG_ROLE=${GRAFANA_ANONYMOUS_ROLE:-Viewer}
      - GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH=/var/lib/grafana/dashboards/img-board.json
    ports:
      - '3111:3000'
    restart: unless-stopped
    depends_on:
      - prometheus

volumes:
  prometheus_data:
  grafana_data:
